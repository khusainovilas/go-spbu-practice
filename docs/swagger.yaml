basePath: /
definitions:
  api.ErrorResponse:
    properties:
      error:
        example: 'invalid movie range: from must not be greater than to'
        type: string
    type: object
  movie.Movie:
    properties:
      actors:
        items:
          type: string
        type: array
      description:
        example: A psychologist visits a space station
        type: string
      director:
        example: Andrei Tarkovsky
        type: string
      genres:
        items:
          type: string
        type: array
      id:
        example: 1
        type: integer
      title:
        example: Solaris
        type: string
      year:
        example: 1972
        type: integer
    type: object
info:
  contact: {}
  description: HTTP and gRPC API over an external movie stand.
  title: Movie Service API
  version: "1.0"
paths:
  /last-movie:
    get:
      description: Finds the latest available movie on the stand.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/movie.Movie'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "408":
          description: Request Timeout
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "504":
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get the last movie
      tags:
      - movies
  /load-movies:
    get:
      description: Loads movies from the external stand. If some ids fail, the response
        is 207 with loaded movies and failed ids in the X-Failed-Ids header.
      parameters:
      - description: First movie id (greater than zero)
        in: query
        name: from
        required: true
        type: integer
      - description: Last movie id (not less than from)
        in: query
        name: to
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/movie.Movie'
            type: array
        "207":
          description: Partial success
          headers:
            X-Failed-Ids:
              description: Comma-separated movie ids that failed
              type: string
          schema:
            items:
              $ref: '#/definitions/movie.Movie'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "408":
          description: Request Timeout
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "504":
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Load movies by id range
      tags:
      - movies
schemes:
- http
swagger: "2.0"
