basePath: /
definitions:
  api.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  movie.Movie:
    properties:
      director:
        type: string
      id:
        type: integer
      title:
        type: string
      year:
        type: integer
    type: object
info:
  contact: {}
  description: HTTP and gRPC API over an external movie stand.
  title: Movie Service API
  version: "1.0"
paths:
  /last-movie:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/movie.Movie'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "408":
          description: Request Timeout
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "504":
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get last movie
      tags:
      - movies
  /load-movies:
    get:
      description: Loads movies in [from; to]. Partial success is returned as 207
        with X-Failed-Ids.
      parameters:
      - description: first movie id
        in: query
        name: from
        required: true
        type: integer
      - description: last movie id
        in: query
        name: to
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/movie.Movie'
            type: array
        "207":
          description: Multi-Status
          headers:
            X-Failed-Ids:
              description: ids that failed
              type: string
          schema:
            items:
              $ref: '#/definitions/movie.Movie'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "408":
          description: Request Timeout
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "504":
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Load movies
      tags:
      - movies
schemes:
- http
swagger: "2.0"
